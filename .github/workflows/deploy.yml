name: Deploy Astro to Hostinger

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    # Los runners tienen IPv6 y el dominio publica registros AAAA; el canal de datos
    # del FTP de Hostinger se corta al conectar por IPv6 (ECONNRESET). Forzar IPv4.
    env:
      NODE_OPTIONS: --dns-result-order=ipv4first
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.4.2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none

      - name: PHP syntax check
        run: |
          find api scripts -name '*.php' -not -name 'config.php' -print0 \
            | xargs -0 -n1 php -l

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build project
        run: pnpm build
        env:
          GRAPH_TENANT_ID: ${{ secrets.GRAPH_TENANT_ID }}
          GRAPH_CLIENT_ID: ${{ secrets.GRAPH_CLIENT_ID }}
          GRAPH_CLIENT_SECRET: ${{ secrets.GRAPH_CLIENT_SECRET }}
          GRAPH_SENDER: ${{ secrets.GRAPH_SENDER }}
          SHEETS_SA_JSON: ${{ secrets.SHEETS_SA_JSON }}
          SHEETS_ID: ${{ secrets.SHEETS_ID }}
          APP_SALT: ${{ secrets.APP_SALT }}

      - name: Deploy to Hostinger (intento 1 de 3)
        id: deploy-1
        continue-on-error: true
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with: &ftp-deploy
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          port: 21
          timeout: 120000
          local-dir: ./dist/
          server-dir: ./
          dangerous-clean-slate: false

      # El FTP de Hostinger corta el canal de datos de forma intermitente
      # ("read ECONNRESET (data socket)"): reintentar espaciado lo resuelve.
      - name: Espera antes del reintento
        if: steps.deploy-1.outcome == 'failure'
        run: sleep 30

      - name: Deploy to Hostinger (intento 2 de 3)
        id: deploy-2
        if: steps.deploy-1.outcome == 'failure'
        continue-on-error: true
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with: *ftp-deploy

      - name: Espera antes del último intento
        if: steps.deploy-1.outcome == 'failure' && steps.deploy-2.outcome == 'failure'
        run: sleep 60

      - name: Deploy to Hostinger (intento 3 de 3)
        if: steps.deploy-1.outcome == 'failure' && steps.deploy-2.outcome == 'failure'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with: *ftp-deploy
